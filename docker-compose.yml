version: '3.8'

services:
  # Servicio PHP/Apache
  web:
    build: .
    container_name: mi_base_datos
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - app-network

  # Servicio MySQL
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: noticias-in
      MYSQL_USER: root
      MYSQL_PASSWORD: master.
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql  # Opcional: script de inicialización
    networks:
      - app-network

