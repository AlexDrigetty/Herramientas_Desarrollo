<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias de Estados Unidos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #2c3e50;
        }
        .news-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .news-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .news-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #f0f0f0;
        }
        .news-content {
            padding: 15px;
        }
        .news-title {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .news-description {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .read-more {
            display: inline-block;
            padding: 8px 15px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .loading, .error {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            grid-column: 1 / -1;
        }
        .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <header>
        <h1>Últimas Noticias de Estados Unidos</h1>
    </header>

    <div class="news-container" id="news-container">
        <div class="loading">Cargando noticias...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const apiKey = 'pub_d304dd2db8604cbc87d54d55a868a814';
            const newsContainer = document.getElementById('news-container');
            const defaultImage = 'https://marketplace.canva.com/EAFrDm3ydqw/1/0/1600w/canva-presentaci%C3%B3n-noticias-telediario-corporativo-azul-rojo-Vh4S5Wt7FD4.jpg';
            
            // Función para obtener noticias de USA
            async function fetchUSNews() {
                try {
                    const response = await fetch(`https://newsdata.io/api/1/news?apikey=${apiKey}&country=ar`);
                    
                    if (!response.ok) {
                        throw new Error('Error al cargar las noticias');
                    }
                    
                    const data = await response.json();
                    
                    if (data.results && data.results.length > 0) {
                        displayNews(data.results);
                    } else {
                        showError('No se encontraron noticias recientes');
                    }
                } catch (error) {
                    showError('Error al conectar con el servicio de noticias');
                    console.error('Error:', error);
                }
            }
            
            // Función para mostrar las noticias
            function displayNews(news) {
                newsContainer.innerHTML = '';
                
                news.forEach(item => {
                    const newsCard = document.createElement('div');
                    newsCard.className = 'news-card';
                    
                    // Verificar si la imagen es válida antes de mostrarla
                    const imageUrl = isValidImageUrl(item.image_url) ? item.image_url : defaultImage;
                    
                    newsCard.innerHTML = `
                        <img src="${imageUrl}" class="news-image">
                        <div class="news-content">
                            <h3 class="news-title">${item.title || 'Título no disponible'}</h3>
                            <p class="news-description">${item.description || 'Descripción no disponible'}</p>
                            ${item.link ? `<a href="${item.link}" target="_blank" class="read-more">Leer más</a>` : ''}
                        </div>
                    `;
                    
                    newsContainer.appendChild(newsCard);
                });
            }
            
            // Función para validar URLs de imagen
            function isValidImageUrl(url) {
                if (!url) return false;
                try {
                    new URL(url);
                    return true;
                } catch {
                    return false;
                }
            }
            
            // Función para mostrar errores
            function showError(message) {
                newsContainer.innerHTML = `<div class="error">${message}</div>`;
            }
            
            // Cargar noticias al iniciar
            fetchUSNews();
        });
    </script>
</body>
</html>
